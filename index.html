<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermier Coffee</title>
  <style>
    /* ── Reset & tokens ──────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #F5F0E8;
      --espresso: #2C1810;
      --brown: #5C3D2E;
      --tan: #A07850;
      --gold: #C8923A;
      --light: #EDE5D8;
      --white: #FFFDF9;
      --green: #2D6A4F;
      --red: #B5331A;
      --blue: #1A5276;
      --r: 10px;
      --sh: 0 2px 12px rgba(44, 24, 16, .10);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--cream);
      color: var(--espresso);
      min-height: 100vh;
    }

    /* ── Views ───────────────────────────────────────────── */
    .view {
      display: none;
    }

    .view.active {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Topbar ──────────────────────────────────────────── */
    .topbar {
      background: var(--espresso);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      gap: 12px;
      flex-shrink: 0;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-logo {
      width: 36px;
      height: 36px;
      background: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .topbar-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .topbar-sub {
      font-size: 11px;
      opacity: .6;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-tb {
      background: rgba(255, 255, 255, .1);
      color: var(--cream);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: var(--r);
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }

    .btn-tb:hover {
      background: rgba(255, 255, 255, .2);
    }

    /* ── POS body ────────────────────────────────────────── */
    .pos-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Menu panel ──────────────────────────────────────── */
    .menu-panel {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .cat-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--tan);
      margin: 22px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--light);
    }

    .cat-label:first-child {
      margin-top: 0;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .menu-item {
      background: var(--white);
      border: 1.5px solid var(--light);
      border-radius: var(--r);
      padding: 14px 12px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .1s;
      display: flex;
      flex-direction: column;
      gap: 3px;
      user-select: none;
    }

    .menu-item:hover {
      border-color: var(--gold);
      box-shadow: var(--sh);
      transform: translateY(-1px);
    }

    .menu-item:active {
      transform: translateY(0);
    }

    .mi-icon {
      font-size: 22px;
      margin-bottom: 3px;
    }

    .mi-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--espresso);
    }

    .mi-price {
      font-size: 12px;
      color: var(--tan);
      font-weight: 500;
    }

    /* ── Order panel ─────────────────────────────────────── */
    .order-panel {
      width: 310px;
      min-width: 260px;
      background: var(--white);
      border-left: 1.5px solid var(--light);
      display: flex;
      flex-direction: column;
    }

    .order-header {
      padding: 16px 18px 12px;
      border-bottom: 1.5px solid var(--light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .order-title {
      font-size: 15px;
      font-weight: 700;
    }

    .order-badge {
      background: var(--gold);
      color: #fff;
      border-radius: 20px;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .order-items {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }

    .order-empty {
      text-align: center;
      color: var(--tan);
      font-size: 13px;
      margin-top: 36px;
      opacity: .7;
      line-height: 1.7;
    }

    .order-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--light);
    }

    .order-row:last-child {
      border-bottom: none;
    }

    .or-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
    }

    .or-qty {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .qty-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--light);
      background: var(--cream);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--espresso);
      transition: background .1s;
    }

    .qty-btn:hover {
      background: var(--light);
    }

    .qty-n {
      font-size: 13px;
      font-weight: 700;
      min-width: 16px;
      text-align: center;
    }

    .or-price {
      font-size: 13px;
      font-weight: 600;
      color: var(--brown);
      min-width: 44px;
      text-align: right;
    }

    .order-footer {
      padding: 12px 18px 18px;
      border-top: 2px solid var(--light);
    }

    .tbl-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tbl-row label {
      font-size: 12px;
      color: var(--tan);
      white-space: nowrap;
      font-weight: 600;
    }

    .tbl-row input {
      flex: 1;
      border: 1.5px solid var(--light);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 13px;
      font-family: inherit;
      color: var(--espresso);
      background: var(--cream);
    }

    .totals-box {
      margin-bottom: 12px;
    }

    .tot-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--brown);
      margin-bottom: 3px;
    }

    .tot-row.grand {
      font-size: 16px;
      font-weight: 700;
      color: var(--espresso);
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1.5px solid var(--light);
    }

    .btn-place {
      width: 100%;
      background: var(--espresso);
      color: var(--cream);
      border: none;
      border-radius: var(--r);
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-place:hover {
      background: var(--brown);
    }

    .btn-place:disabled {
      background: var(--light);
      color: var(--tan);
      cursor: not-allowed;
    }

    .btn-clr {
      width: 100%;
      background: none;
      color: var(--red);
      border: 1.5px solid var(--light);
      border-radius: var(--r);
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 7px;
      transition: background .1s;
    }

    .btn-clr:hover {
      background: #fff0ee;
    }

    /* ── Receipt modal ───────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(44, 24, 16, .52);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      background: var(--white);
      border-radius: 16px;
      padding: 28px 24px 22px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 12px 48px rgba(44, 24, 16, .25);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-ttl {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .receipt-pre {
      background: #fff;
      border: 1.5px dashed var(--tan);
      border-radius: 8px;
      padding: 14px;
      font-family: 'Courier New', monospace;
      font-size: 11.5px;
      line-height: 1.75;
      max-height: 320px;
      overflow-y: auto;
      margin-bottom: 18px;
      color: #111;
    }

    .r-c {
      text-align: center;
    }

    .r-b {
      font-weight: 700;
    }

    .r-hr {
      border-top: 1px dashed #aaa;
      margin: 5px 0;
    }

    .r-rw {
      display: flex;
      justify-content: space-between;
    }

    .modal-acts {
      display: flex;
      gap: 10px;
    }

    .btn-print {
      flex: 1;
      background: var(--espresso);
      color: var(--cream);
      border: none;
      border-radius: var(--r);
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-print:hover {
      background: var(--brown);
    }

    .btn-cancel {
      flex: 1;
      background: none;
      color: var(--espresso);
      border: 1.5px solid var(--light);
      border-radius: var(--r);
      padding: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-cancel:hover {
      background: var(--light);
    }

    /* ── Admin topbar ────────────────────────────────────── */
    #view-admin .topbar {
      background: var(--brown);
    }

    /* ── Admin tabs ──────────────────────────────────────── */
    .admin-tabs {
      display: flex;
      gap: 0;
      background: var(--light);
      border-bottom: 2px solid var(--light);
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--tan);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color .15s;
    }

    .tab-btn.active {
      color: var(--espresso);
      border-bottom-color: var(--espresso);
      background: var(--white);
    }

    .tab-pane {
      display: none;
      flex: 1;
      overflow-y: auto;
    }

    .tab-pane.active {
      display: block;
    }

    /* ── Admin body ──────────────────────────────────────── */
    .admin-body {
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .sec-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--tan);
      margin: 24px 0 12px;
    }

    .sec-title:first-child {
      margin-top: 0;
    }

    /* add form */
    .add-form {
      background: var(--white);
      border: 1.5px solid var(--light);
      border-radius: var(--r);
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .fg {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fg label {
      font-size: 11px;
      font-weight: 700;
      color: var(--tan);
    }

    .fg input,
    .fg select {
      border: 1.5px solid var(--light);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--espresso);
      background: var(--cream);
      transition: border-color .15s;
    }

    .fg input:focus,
    .fg select:focus {
      outline: none;
      border-color: var(--gold);
    }

    .fg.full {
      grid-column: 1/-1;
    }

    .btn-add-item {
      grid-column: 1/-1;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: var(--r);
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-add-item:hover {
      background: #1f4f39;
    }

    /* item list */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .adm-row {
      background: var(--white);
      border: 1.5px solid var(--light);
      border-radius: var(--r);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ar-icon {
      font-size: 18px;
    }

    .ar-info {
      flex: 1;
    }

    .ar-name {
      font-size: 13px;
      font-weight: 600;
    }

    .ar-cat {
      font-size: 11px;
      color: var(--tan);
    }

    .ar-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--brown);
      min-width: 52px;
      text-align: right;
    }

    .btn-edit {
      background: var(--cream);
      border: 1.5px solid var(--light);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--espresso);
    }

    .btn-edit:hover {
      background: var(--light);
    }

    .btn-del {
      background: none;
      border: none;
      color: var(--red);
      font-size: 17px;
      cursor: pointer;
      padding: 0 3px;
      line-height: 1;
    }

    /* category manager */
    .cat-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }

    .cat-row {
      background: var(--white);
      border: 1.5px solid var(--light);
      border-radius: var(--r);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cat-row-icon {
      font-size: 18px;
    }

    .cat-row-name {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
    }

    .cat-row-count {
      font-size: 11px;
      color: var(--tan);
    }

    .add-cat-form {
      background: var(--white);
      border: 1.5px solid var(--light);
      border-radius: var(--r);
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-add-cat {
      grid-column: 1/-1;
      background: var(--brown);
      color: #fff;
      border: none;
      border-radius: var(--r);
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-add-cat:hover {
      background: var(--espresso);
    }

    /* ── Sales dashboard ─────────────────────────────────── */
    .sales-body {
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--white);
      border: 1.5px solid var(--light);
      border-radius: var(--r);
      padding: 18px 16px;
    }

    .stat-val {
      font-size: 24px;
      font-weight: 700;
      color: var(--espresso);
      margin-bottom: 2px;
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--tan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-sub {
      font-size: 12px;
      color: var(--brown);
      margin-top: 4px;
      font-weight: 500;
    }

    .chart-wrap {
      background: var(--white);
      border: 1.5px solid var(--light);
      border-radius: var(--r);
      padding: 18px;
      margin-bottom: 16px;
    }

    .chart-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--tan);
      margin-bottom: 14px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .bar-label {
      font-size: 12px;
      color: var(--espresso);
      width: 130px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
    }

    .bar-track {
      flex: 1;
      background: var(--light);
      border-radius: 4px;
      height: 20px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 4px;
      transition: width .4s;
      display: flex;
      align-items: center;
      padding-left: 6px;
    }

    .bar-fill.alt {
      background: var(--brown);
    }

    .bar-val {
      font-size: 11px;
      font-weight: 700;
      color: var(--white);
      white-space: nowrap;
    }

    .orders-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .orders-table th {
      text-align: left;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--tan);
      border-bottom: 1.5px solid var(--light);
    }

    .orders-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--light);
      color: var(--espresso);
    }

    .orders-table tr:last-child td {
      border-bottom: none;
    }

    .orders-table tr:hover td {
      background: var(--cream);
    }

    .sales-filter {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .sales-filter label {
      font-size: 12px;
      font-weight: 700;
      color: var(--tan);
    }

    .sales-filter select,
    .sales-filter input {
      border: 1.5px solid var(--light);
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--espresso);
      background: var(--white);
    }

    .btn-export {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: var(--r);
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-export:hover {
      background: #1f4f39;
    }

    .btn-clr-data {
      background: none;
      color: var(--red);
      border: 1.5px solid var(--light);
      border-radius: var(--r);
      padding: 7px 14px;
      font-size: 12px;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--tan);
      font-size: 13px;
      line-height: 1.7;
    }

    /* ── Login ───────────────────────────────────────────── */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(44, 24, 16, .7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .login-box {
      background: var(--white);
      border-radius: 16px;
      padding: 36px 32px;
      width: 320px;
      box-shadow: 0 16px 48px rgba(44, 24, 16, .3);
      text-align: center;
    }

    .login-logo {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .login-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .login-sub {
      font-size: 12px;
      color: var(--tan);
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      border: 1.5px solid var(--light);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--espresso);
      background: var(--cream);
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 3px;
    }

    .login-box input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .btn-login {
      width: 100%;
      background: var(--espresso);
      color: var(--cream);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-login:hover {
      background: var(--brown);
    }

    .login-err {
      color: var(--red);
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    /* ── Toast ───────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--espresso);
      color: var(--cream);
      padding: 11px 22px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      z-index: 300;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }

    /* ── Print ───────────────────────────────────────────── */
    @media print {
      body * {
        visibility: hidden;
      }

      #print-area,
      #print-area * {
        visibility: visible;
      }

      #print-area {
        position: fixed;
        left: 0;
        top: 0;
        width: 80mm;
        font-family: 'Courier New', monospace;
        font-size: 11px;
        color: #000;
        padding: 6mm 5mm;
      }
    }

    @media(max-width:600px) {
      .pos-body {
        flex-direction: column;
      }

      .order-panel {
        width: 100%;
        min-width: unset;
      }

      .menu-panel {
        overflow-y: unset;
      }
    }
  </style>
</head>

<body>

  <!-- ═══════════════ POS VIEW ═══════════════ -->
  <div id="view-pos" class="view active">
    <div class="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo">☕</div>
        <div>
          <div class="topbar-name">Mermier Coffee</div>
          <div class="topbar-sub">Point of Sale</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn-tb" onclick="openAdmin()">⚙ Admin</button>
      </div>
    </div>
    <div class="pos-body">
      <div class="menu-panel" id="menu-panel"></div>
      <div class="order-panel">
        <div class="order-header">
          <div class="order-title">Current Order</div>
          <div class="order-badge" id="order-badge">0</div>
        </div>
        <div class="order-items" id="order-items">
          <div class="order-empty">Tap items on the left<br>to add them here</div>
        </div>
        <div class="order-footer">
          <div class="tbl-row">
            <label>Table No.</label>
            <input type="text" id="table-no" placeholder="e.g. T1, T2 …" />
          </div>
          <div class="totals-box">
            <div class="tot-row"><span>Subtotal</span><span id="subtotal">₱ 0.00</span></div>
            <div class="tot-row grand"><span>Total</span><span id="total-amt">₱ 0.00</span></div>
          </div>
          <button class="btn-place" id="btn-place" onclick="openReceipt()" disabled>
            🖨 Place Order &amp; Print Bill
          </button>
          <button class="btn-clr" onclick="clearOrder()">🗑 Clear order</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════ ADMIN VIEW ═══════════════ -->
  <div id="view-admin" class="view">
    <div class="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo">⚙</div>
        <div>
          <div class="topbar-name">Admin Panel</div>
          <div class="topbar-sub">Mermier Coffee</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn-tb" onclick="showView('pos')">← Back</button>
      </div>
    </div>
    <div class="admin-tabs">
      <button class="tab-btn active" onclick="switchTab('tab-items',this)">Menu Items</button>
      <button class="tab-btn" onclick="switchTab('tab-cats',this)">Categories</button>
      <button class="tab-btn" onclick="switchTab('tab-sales',this)">📊 Sales Dashboard</button>
    </div>

    <!-- Tab: Menu Items -->
    <div class="tab-pane active" id="tab-items">
      <div class="admin-body">
        <div class="sec-title">Add New Item</div>
        <div class="add-form">
          <div class="fg"><label>Item Name</label><input type="text" id="new-name" placeholder="e.g. Matcha Latte" />
          </div>
          <div class="fg"><label>Price (₱)</label><input type="number" id="new-price" placeholder="e.g. 110" min="1" />
          </div>
          <div class="fg"><label>Category</label><select id="new-cat" style="width:100%"></select></div>
          <div class="fg"><label>Emoji Icon</label><input type="text" id="new-icon" placeholder="e.g. 🍵"
              maxlength="2" /></div>
          <button class="btn-add-item" onclick="addItem()">+ Add Item to Menu</button>
        </div>
        <div class="sec-title">Current Menu</div>
        <div class="item-list" id="admin-item-list"></div>
      </div>
    </div>

    <!-- Tab: Categories -->
    <div class="tab-pane" id="tab-cats">
      <div class="admin-body">
        <div class="sec-title">Current Categories</div>
        <div class="cat-list" id="cat-list"></div>
        <div class="sec-title">Add New Category</div>
        <div class="add-cat-form">
          <div class="fg"><label>Category Name</label><input type="text" id="new-cat-name"
              placeholder="e.g. Seasonal Specials" /></div>
          <div class="fg"><label>Emoji Icon</label><input type="text" id="new-cat-icon" placeholder="e.g. 🌸"
              maxlength="2" /></div>
          <button class="btn-add-cat" onclick="addCategory()">+ Add Category</button>
        </div>
      </div>
    </div>

    <!-- Tab: Sales Dashboard -->
    <div class="tab-pane" id="tab-sales">
      <div class="sales-body">
        <div class="sales-filter">
          <label>Month</label>
          <select id="filter-month" onchange="renderSales()"></select>
          <label>Year</label>
          <select id="filter-year" onchange="renderSales()"></select>
          <button class="btn-export" onclick="exportCSV()">⬇ Export CSV</button>
          <button class="btn-clr-data" onclick="clearSalesData()">🗑 Clear all data</button>
        </div>
        <div id="sales-content"></div>
      </div>
    </div>
  </div>

  <!-- ═══════════════ RECEIPT MODAL ═══════════════ -->
  <div class="overlay" id="receipt-modal">
    <div class="modal">
      <div class="modal-ttl">🧾 Order Receipt Preview</div>
      <div class="receipt-pre" id="receipt-preview"></div>
      <div class="modal-acts">
        <button class="btn-cancel" onclick="closeReceipt()">Cancel</button>
        <button class="btn-print" onclick="printReceipt()">🖨 Print 2 Copies</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════ LOGIN ═══════════════ -->
  <div id="login-overlay">
    <div class="login-box">
      <div class="login-logo">🔐</div>
      <div class="login-title">Admin Login</div>
      <div class="login-sub">Enter the admin password</div>
      <input type="password" id="admin-pass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()" />
      <button class="btn-login" onclick="doLogin()">Log In</button>
      <div class="login-err" id="login-err">Incorrect password. Try again.</div>
      <button onclick="document.getElementById('login-overlay').style.display='none'"
        style="background:none;border:none;color:var(--tan);font-size:12px;margin-top:12px;cursor:pointer">Cancel</button>
    </div>
  </div>

  <!-- ═══════════════ PRINT AREA ═══════════════ -->
  <div id="print-area" style="display:none"></div>

  <!-- ═══════════════ TOAST ═══════════════ -->
  <div class="toast" id="toast"></div>

  <script>
    /* ────────────────────────────────────────────────────
       CONFIG  (edit this section)
    ──────────────────────────────────────────────────── */
    const ADMIN_PASSWORD = "Jiji20";

    /* ────────────────────────────────────────────────────
       DEFAULT DATA
    ──────────────────────────────────────────────────── */
    const DEFAULT_CATS = [
      { id: "Coffee", icon: "☕" },
      { id: "Non Coffee", icon: "🥤" },
      { id: "Pastry", icon: "🍪" },
    ];

    const DEFAULT_MENU = [
      { id: 1, name: "Americano", price: 80, category: "Coffee", icon: "☕" },
      { id: 2, name: "Cappuccino", price: 100, category: "Coffee", icon: "☕" },
      { id: 3, name: "Spanish Latte", price: 100, category: "Coffee", icon: "☕" },
      { id: 4, name: "Dark Mocha", price: 100, category: "Coffee", icon: "☕" },
      { id: 5, name: "Salted Caramel Iced Mocha", price: 110, category: "Coffee", icon: "🧋" },
      { id: 6, name: "Hot Chocolate", price: 80, category: "Non Coffee", icon: "🍫" },
      { id: 7, name: "Mango Shake", price: 80, category: "Non Coffee", icon: "🥭" },
      { id: 8, name: "Watermelon Shake", price: 80, category: "Non Coffee", icon: "🍉" },
      { id: 9, name: "Cookies", price: 35, category: "Pastry", icon: "🍪" },
      { id: 10, name: "Brownies", price: 35, category: "Pastry", icon: "🍫" },
    ];

    /* ────────────────────────────────────────────────────
       STATE
    ──────────────────────────────────────────────────── */
    let menu = JSON.parse(localStorage.getItem("mc_menu")) || DEFAULT_MENU;
    let categories = JSON.parse(localStorage.getItem("mc_cats")) || DEFAULT_CATS;
    let salesLog = JSON.parse(localStorage.getItem("mc_sales")) || [];
    let order = {};

    function saveMenu() { localStorage.setItem("mc_menu", JSON.stringify(menu)); }
    function saveCats() { localStorage.setItem("mc_cats", JSON.stringify(categories)); }
    function saveSales() { localStorage.setItem("mc_sales", JSON.stringify(salesLog)); }

    /* ────────────────────────────────────────────────────
       TOAST
    ──────────────────────────────────────────────────── */
    let _tt;
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove("show"), 2000);
    }

    /* ────────────────────────────────────────────────────
       VIEWS & TABS
    ──────────────────────────────────────────────────── */
    function showView(id) {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById("view-" + id).classList.add("active");
      if (id === "pos") renderMenu();
      if (id === "admin") { populateCatSelect(); renderAdminList(); renderCatList(); initSalesFilters(); }
    }

    function switchTab(paneId, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(paneId).classList.add("active");
      if (paneId === "tab-sales") renderSales();
    }

    /* ────────────────────────────────────────────────────
       MENU RENDER
    ──────────────────────────────────────────────────── */
    function renderMenu() {
      const panel = document.getElementById("menu-panel");
      const activeCats = categories.filter(c => menu.some(m => m.category === c.id));
      if (!activeCats.length) { panel.innerHTML = '<div class="order-empty">No menu items yet. Add some in Admin.</div>'; return; }
      panel.innerHTML = activeCats.map(cat => {
        const items = menu.filter(m => m.category === cat.id);
        return `<div class="cat-label">${cat.icon} ${cat.id}</div>
    <div class="menu-grid">
      ${items.map(item => `
        <div class="menu-item" onclick="addToOrder(${item.id})">
          <div class="mi-icon">${item.icon}</div>
          <div class="mi-name">${item.name}</div>
          <div class="mi-price">₱ ${item.price}</div>
        </div>`).join("")}
    </div>`;
      }).join("");
    }

    /* ────────────────────────────────────────────────────
       ORDER LOGIC
    ──────────────────────────────────────────────────── */
    function addToOrder(id) {
      order[id] = (order[id] || 0) + 1;
      renderOrder();
      showToast("Added ✓");
    }
    function changeQty(id, delta) {
      order[id] = (order[id] || 0) + delta;
      if (order[id] <= 0) delete order[id];
      renderOrder();
    }
    function clearOrder() {
      order = {};
      document.getElementById("table-no").value = "";
      renderOrder();
    }

    function renderOrder() {
      const ids = Object.keys(order).map(Number);
      const totalQty = ids.reduce((s, id) => s + order[id], 0);
      document.getElementById("order-badge").textContent = totalQty;
      const itemsEl = document.getElementById("order-items");
      const btnEl = document.getElementById("btn-place");

      if (!ids.length) {
        itemsEl.innerHTML = '<div class="order-empty">Tap items on the left<br>to add them here</div>';
        document.getElementById("subtotal").textContent = "₱ 0.00";
        document.getElementById("total-amt").textContent = "₱ 0.00";
        btnEl.disabled = true; return;
      }
      let sub = 0;
      itemsEl.innerHTML = ids.map(id => {
        const item = menu.find(m => m.id === id); if (!item) return "";
        const line = item.price * order[id]; sub += line;
        return `<div class="order-row">
      <div class="or-name">${item.name}</div>
      <div class="or-qty">
        <button class="qty-btn" onclick="changeQty(${id},-1)">−</button>
        <div class="qty-n">${order[id]}</div>
        <button class="qty-btn" onclick="changeQty(${id},1)">+</button>
      </div>
      <div class="or-price">₱${line}</div>
    </div>`;
      }).join("");
      document.getElementById("subtotal").textContent = `₱ ${sub.toFixed(2)}`;
      document.getElementById("total-amt").textContent = `₱ ${sub.toFixed(2)}`;
      btnEl.disabled = false;
    }

    /* ────────────────────────────────────────────────────
       RECEIPT
    ──────────────────────────────────────────────────── */
    function calcTotal() {
      return Object.keys(order).map(Number).reduce((s, id) => {
        const m = menu.find(x => x.id === id); return s + (m ? m.price * order[id] : 0);
      }, 0);
    }

    function buildReceiptHTML() {
      const ids = Object.keys(order).map(Number);
      const tbl = document.getElementById("table-no").value.trim() || "—";
      const now = new Date();
      const ds = now.toLocaleDateString("en-PH", { year: "numeric", month: "long", day: "numeric" });
      const ts = now.toLocaleTimeString("en-PH", { hour: "2-digit", minute: "2-digit" });
      let total = 0;
      const rows = ids.map(id => {
        const item = menu.find(m => m.id === id); if (!item) return "";
        const line = item.price * order[id]; total += line;
        return `<div class="r-rw"><span>${item.name} ×${order[id]}</span><span>₱${line}</span></div>`;
      }).join("");
      return `
    <div class="r-c r-b">MERMIER COFFEE</div>
    <div class="r-c" style="font-size:10px">Brewing Hope, Serving Love</div>
    <div class="r-hr"></div>
    <div class="r-rw"><span>Date:</span><span>${ds}</span></div>
    <div class="r-rw"><span>Time:</span><span>${ts}</span></div>
    <div class="r-rw"><span>Table No.:</span><span>${tbl}</span></div>
    <div class="r-hr"></div>
    <div class="r-b" style="margin-bottom:4px">ITEMS</div>
    ${rows}
    <div class="r-hr"></div>
    <div class="r-rw r-b"><span>TOTAL</span><span>₱${total.toFixed(2)}</span></div>
    <div class="r-hr"></div>
    <div class="r-c" style="margin-top:6px">Thank you for your order!</div>
    <div class="r-c">Please come again ☕</div>`;
    }

    function buildReceiptText() {
      const ids = Object.keys(order).map(Number);
      const tbl = document.getElementById("table-no").value.trim() || "—";
      const now = new Date();
      const ds = now.toLocaleDateString("en-PH", { year: "numeric", month: "long", day: "numeric" });
      const ts = now.toLocaleTimeString("en-PH", { hour: "2-digit", minute: "2-digit" });
      let total = 0;
      const sep = "-".repeat(32);
      const rows = ids.map(id => {
        const item = menu.find(m => m.id === id); if (!item) return "";
        const line = item.price * order[id]; total += line;
        const nm = item.name.length > 16 ? item.name.slice(0, 15) + "…" : item.name;
        const left = `${nm} x${order[id]}`;
        return left.padEnd(22) + (`₱${line}`).padStart(10);
      }).join("\n");

      // Build single copy text
      const copy = [
        "      MERMIER COFFEE",
        "  Brewing Hope, Serving Love",
        sep,
        `Date  : ${ds}`,
        `Time  : ${ts}`,
        `Table : ${tbl}`,
        sep,
        rows,
        sep,
        `${"TOTAL".padEnd(22)}${("₱" + total.toFixed(2)).padStart(10)}`,
        sep,
        "  Thank you for your order!",
        "    Please come again :)",
        "",
      ].join("\n");

      // Two copies separated by a blank line + cut mark
      return copy + "\n\n" + "- - - - CUT HERE - - - -\n\n" + copy;
    }

    function openReceipt() {
      document.getElementById("receipt-preview").innerHTML = buildReceiptHTML();
      document.getElementById("receipt-modal").classList.add("open");
    }
    function closeReceipt() {
      document.getElementById("receipt-modal").classList.remove("open");
    }
    function printReceipt() {
      // Save to sales log first
      const ids = Object.keys(order).map(Number);
      const tbl = document.getElementById("table-no").value.trim() || "—";
      const now = new Date();
      let total = 0;
      const items = ids.map(id => {
        const item = menu.find(m => m.id === id); if (!item) return null;
        const line = item.price * order[id]; total += line;
        return { name: item.name, category: item.category, qty: order[id], price: item.price, line };
      }).filter(Boolean);
      salesLog.push({
        id: Date.now(),
        date: now.toISOString(),
        table: tbl,
        items,
        total,
      });
      saveSales();

      // Print
      const pa = document.getElementById("print-area");
      pa.style.display = "block";
      pa.innerHTML = `<pre style="font-family:'Courier New',monospace;font-size:11px;white-space:pre;color:#000;line-height:1.6">${buildReceiptText()}</pre>`;
      window.print();
      setTimeout(() => {
        pa.style.display = "none";
        closeReceipt();
        clearOrder();
        showToast("Bill printed (2 copies) ✓");
      }, 500);
    }

    /* ────────────────────────────────────────────────────
       ADMIN LOGIN
    ──────────────────────────────────────────────────── */
    function openAdmin() {
      const lo = document.getElementById("login-overlay");
      lo.style.display = "flex";
      document.getElementById("admin-pass").value = "";
      document.getElementById("login-err").style.display = "none";
      setTimeout(() => document.getElementById("admin-pass").focus(), 80);
    }
    function doLogin() {
      const pw = document.getElementById("admin-pass").value;
      if (pw === ADMIN_PASSWORD) {
        document.getElementById("login-overlay").style.display = "none";
        showView("admin");
      } else {
        document.getElementById("login-err").style.display = "block";
        document.getElementById("admin-pass").value = "";
        document.getElementById("admin-pass").focus();
      }
    }

    /* ────────────────────────────────────────────────────
       CATEGORY MANAGEMENT
    ──────────────────────────────────────────────────── */
    function populateCatSelect() {
      const sel = document.getElementById("new-cat");
      sel.innerHTML = categories.map(c => `<option value="${c.id}">${c.icon} ${c.id}</option>`).join("");
    }

    function renderCatList() {
      const list = document.getElementById("cat-list");
      list.innerHTML = categories.map(cat => {
        const count = menu.filter(m => m.category === cat.id).length;
        const isDefault = ["Coffee", "Non Coffee", "Pastry"].includes(cat.id);
        return `<div class="cat-row">
      <div class="cat-row-icon">${cat.icon}</div>
      <div class="cat-row-name">${cat.id}</div>
      <div class="cat-row-count">${count} item${count !== 1 ? "s" : ""}</div>
      ${isDefault
            ? `<span style="font-size:11px;color:var(--tan);padding:4px 8px">Default</span>`
            : `<button class="btn-del" onclick="deleteCategory('${cat.id}')" title="Delete category">🗑</button>`}
    </div>`;
      }).join("");
    }

    function addCategory() {
      const name = document.getElementById("new-cat-name").value.trim();
      const icon = document.getElementById("new-cat-icon").value.trim() || "🏷";
      if (!name) { showToast("Enter a category name"); return; }
      if (categories.find(c => c.id.toLowerCase() === name.toLowerCase())) {
        showToast("Category already exists"); return;
      }
      categories.push({ id: name, icon });
      saveCats();
      renderCatList();
      populateCatSelect();
      document.getElementById("new-cat-name").value = "";
      document.getElementById("new-cat-icon").value = "";
      showToast("Category added ✓");
    }

    function deleteCategory(id) {
      const count = menu.filter(m => m.category === id).length;
      const msg = count > 0
        ? `"${id}" has ${count} item(s). Deleting it will also remove those items. Continue?`
        : `Delete category "${id}"?`;
      if (!confirm(msg)) return;
      menu = menu.filter(m => m.category !== id);
      categories = categories.filter(c => c.id !== id);
      saveMenu(); saveCats();
      renderCatList();
      renderAdminList();
      populateCatSelect();
      showToast("Category deleted");
    }

    /* ────────────────────────────────────────────────────
       MENU ITEM MANAGEMENT
    ──────────────────────────────────────────────────── */
    function renderAdminList() {
      const list = document.getElementById("admin-item-list");
      if (!menu.length) { list.innerHTML = '<div class="order-empty" style="padding:20px 0">No items yet.</div>'; return; }
      list.innerHTML = categories.map(cat => {
        const items = menu.filter(m => m.category === cat.id);
        if (!items.length) return "";
        return `<div style="font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--tan);margin:14px 0 6px">${cat.icon} ${cat.id}</div>`
          + items.map(item => `
        <div class="adm-row">
          <div class="ar-icon">${item.icon}</div>
          <div class="ar-info">
            <div class="ar-name">${item.name}</div>
            <div class="ar-cat">${item.category}</div>
          </div>
          <div class="ar-price">₱ ${item.price}</div>
          <button class="btn-edit" onclick="editItem(${item.id})">Edit</button>
          <button class="btn-del" onclick="deleteItem(${item.id})">🗑</button>
        </div>`).join("");
      }).join("");
    }

    function addItem() {
      const name = document.getElementById("new-name").value.trim();
      const price = parseInt(document.getElementById("new-price").value);
      const cat = document.getElementById("new-cat").value;
      const icon = document.getElementById("new-icon").value.trim() || (categories.find(c => c.id === cat) || { icon: "☕" }).icon;
      if (!name || !price || price < 1) { showToast("Fill in Name and Price"); return; }
      const newId = menu.length ? Math.max(...menu.map(m => m.id)) + 1 : 1;
      menu.push({ id: newId, name, price, category: cat, icon });
      saveMenu();
      renderAdminList();
      document.getElementById("new-name").value = "";
      document.getElementById("new-price").value = "";
      document.getElementById("new-icon").value = "";
      showToast("Item added ✓");
    }

    function deleteItem(id) {
      if (!confirm("Remove this item from the menu?")) return;
      menu = menu.filter(m => m.id !== id);
      saveMenu(); renderAdminList();
      showToast("Item removed");
    }

    function editItem(id) {
      const item = menu.find(m => m.id === id); if (!item) return;
      const n = prompt("Item name:", item.name); if (!n) return;
      const p = parseInt(prompt("Price (₱):", item.price)); if (!p || p < 1) { showToast("Invalid price"); return; }
      const ic = prompt("Emoji icon:", item.icon) || item.icon;
      item.name = n.trim(); item.price = p; item.icon = ic.trim();
      saveMenu(); renderAdminList();
      showToast("Item updated ✓");
    }

    /* ────────────────────────────────────────────────────
       SALES DASHBOARD
    ──────────────────────────────────────────────────── */
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    function initSalesFilters() {
      const now = new Date();
      const mSel = document.getElementById("filter-month");
      const ySel = document.getElementById("filter-year");
      mSel.innerHTML = MONTHS.map((m, i) => `<option value="${i}"${i === now.getMonth() ? " selected" : ""}>${m}</option>`).join("");
      // year range
      const years = new Set(salesLog.map(s => new Date(s.date).getFullYear()));
      years.add(now.getFullYear());
      const yArr = [...years].sort((a, b) => b - a);
      ySel.innerHTML = yArr.map(y => `<option value="${y}"${y === now.getFullYear() ? " selected" : ""}>${y}</option>`).join("");
      renderSales();
    }

    function getFilteredSales() {
      const m = parseInt(document.getElementById("filter-month").value);
      const y = parseInt(document.getElementById("filter-year").value);
      return salesLog.filter(s => {
        const d = new Date(s.date);
        return d.getMonth() === m && d.getFullYear() === y;
      });
    }

    function renderSales() {
      const filtered = getFilteredSales();
      const m = parseInt(document.getElementById("filter-month").value);
      const y = parseInt(document.getElementById("filter-year").value);
      const el = document.getElementById("sales-content");

      if (!filtered.length) {
        el.innerHTML = `<div class="empty-state">📭 No orders recorded for ${MONTHS[m]} ${y}.<br>Orders will appear here automatically after each sale.</div>`;
        return;
      }

      const totalRevenue = filtered.reduce((s, o) => s + o.total, 0);
      const totalOrders = filtered.length;
      const avgOrder = totalRevenue / totalOrders;

      // Item frequency
      const itemMap = {};
      filtered.forEach(ord => ord.items.forEach(it => {
        if (!itemMap[it.name]) itemMap[it.name] = { qty: 0, revenue: 0 };
        itemMap[it.name].qty += it.qty;
        itemMap[it.name].revenue += it.line;
      }));
      const topItems = Object.entries(itemMap).sort((a, b) => b[1].revenue - a[1].revenue).slice(0, 6);

      // Category revenue
      const catMap = {};
      filtered.forEach(ord => ord.items.forEach(it => {
        catMap[it.category] = (catMap[it.category] || 0) + it.line;
      }));
      const catEntries = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
      const maxCatRev = catEntries[0]?.[1] || 1;

      // Daily sales
      const dayMap = {};
      filtered.forEach(ord => {
        const dk = new Date(ord.date).toLocaleDateString("en-PH", { month: "short", day: "numeric" });
        dayMap[dk] = (dayMap[dk] || 0) + ord.total;
      });
      const dayEntries = Object.entries(dayMap).sort((a, b) => new Date(a[0]) - new Date(b[0]));
      const maxDayRev = Math.max(...dayEntries.map(d => d[1]), 1);

      const maxItemRev = topItems[0]?.[1].revenue || 1;

      el.innerHTML = `
    <!-- Stat cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val">₱${totalRevenue.toLocaleString("en-PH", { minimumFractionDigits: 2 })}</div>
        <div class="stat-lbl">Total Revenue</div>
        <div class="stat-sub">${MONTHS[m]} ${y}</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">${totalOrders}</div>
        <div class="stat-lbl">Total Orders</div>
        <div class="stat-sub">This month</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">₱${avgOrder.toFixed(2)}</div>
        <div class="stat-lbl">Avg. Order Value</div>
        <div class="stat-sub">Per transaction</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">${topItems[0]?.[0] || "—"}</div>
        <div class="stat-lbl">Top Item</div>
        <div class="stat-sub">${topItems[0] ? `${topItems[0][1].qty} sold` : "—"}</div>
      </div>
    </div>

    <!-- Top items -->
    <div class="chart-wrap">
      <div class="chart-title">Top items by revenue</div>
      ${topItems.map(([name, d]) => `
        <div class="bar-row">
          <div class="bar-label">${name}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${Math.round(d.revenue / maxItemRev * 100)}%">
              <span class="bar-val">₱${d.revenue}</span>
            </div>
          </div>
        </div>`).join("")}
    </div>

    <!-- Category breakdown -->
    <div class="chart-wrap">
      <div class="chart-title">Revenue by category</div>
      ${catEntries.map(([cat, rev]) => `
        <div class="bar-row">
          <div class="bar-label">${cat}</div>
          <div class="bar-track">
            <div class="bar-fill alt" style="width:${Math.round(rev / maxCatRev * 100)}%">
              <span class="bar-val">₱${rev}</span>
            </div>
          </div>
        </div>`).join("")}
    </div>

    <!-- Daily sales -->
    <div class="chart-wrap">
      <div class="chart-title">Daily revenue — ${MONTHS[m]} ${y}</div>
      ${dayEntries.map(([day, rev]) => `
        <div class="bar-row">
          <div class="bar-label">${day}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${Math.round(rev / maxDayRev * 100)}%;background:var(--green)">
              <span class="bar-val">₱${rev.toFixed(0)}</span>
            </div>
          </div>
        </div>`).join("")}
    </div>

    <!-- Order log -->
    <div class="chart-wrap">
      <div class="chart-title">Order log — ${filtered.length} orders</div>
      <table class="orders-table">
        <thead><tr>
          <th>Date &amp; Time</th><th>Table</th><th>Items</th><th>Total</th>
        </tr></thead>
        <tbody>
          ${filtered.slice().reverse().map(ord => {
        const d = new Date(ord.date);
        const ds = d.toLocaleDateString("en-PH", { month: "short", day: "numeric" });
        const ts = d.toLocaleTimeString("en-PH", { hour: "2-digit", minute: "2-digit" });
        return `<tr>
              <td>${ds}, ${ts}</td>
              <td>${ord.table}</td>
              <td>${ord.items.map(i => `${i.name}×${i.qty}`).join(", ")}</td>
              <td style="font-weight:700">₱${ord.total.toFixed(2)}</td>
            </tr>`;
      }).join("")}
        </tbody>
      </table>
    </div>`;
    }

    function exportCSV() {
      const filtered = getFilteredSales();
      const m = parseInt(document.getElementById("filter-month").value);
      const y = parseInt(document.getElementById("filter-year").value);
      if (!filtered.length) { showToast("No data to export"); return; }

      const rows = [["Date", "Time", "Table", "Item", "Category", "Qty", "Unit Price", "Line Total", "Order Total"]];
      filtered.forEach(ord => {
        const d = new Date(ord.date);
        const ds = d.toLocaleDateString("en-PH");
        const ts = d.toLocaleTimeString("en-PH", { hour: "2-digit", minute: "2-digit" });
        ord.items.forEach(it => {
          rows.push([ds, ts, ord.table, it.name, it.category, it.qty, it.price, it.line, ord.total]);
        });
      });

      const csv = rows.map(r => r.map(v => `"${v}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `mermier-sales-${MONTHS[m]}-${y}.csv`;
      a.click();
      showToast("CSV exported ✓");
    }

    function clearSalesData() {
      if (!confirm("Delete ALL saved sales data? This cannot be undone.")) return;
      salesLog = [];
      saveSales();
      renderSales();
      showToast("Sales data cleared");
    }

    /* ────────────────────────────────────────────────────
       INIT
    ──────────────────────────────────────────────────── */
    renderMenu();
    renderOrder();
  </script>
</body>

</html>
